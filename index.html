<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIR CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent: #38bdf8;
            --gold: #facc15;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
            box-sizing: border-box;
            border: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .balance { font-size: 18px; font-weight: 800; color: var(--gold); }
        
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1 1 28%;
            padding: 10px 4px;
            background: var(--card-bg);
            border: 1px solid #1e293b;
            color: var(--text);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.active { border-color: var(--accent); background: #0284c7; }
        
        .game-card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #1e293b;
            position: relative;
        }
        
        /* Controls */
        .controls { width: 100%; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .bet-input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #334155; background: #0b0f19;
            color: #fff; font-size: 16px; text-align: center; box-sizing: border-box; font-weight: bold;
        }
        .action-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--green); color: white; font-size: 16px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        .action-btn:active { transform: scale(0.98); }

        /* Custom Notification Modal */
        #win-modal {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid var(--gold);
            padding: 15px 25px; border-radius: 16px; text-align: center;
            display: none; z-index: 100; box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
        }

        /* Slots Style */
        .slots-box {
            display: flex; gap: 10px; background: #0b0f19; padding: 20px;
            border-radius: 16px; border: 2px solid #334155; margin: 20px 0;
        }
        .slot-reel {
            font-size: 50px; width: 65px; height: 75px; display: flex;
            align-items: center; justify-content: center; background: #151c2c;
            border-radius: 10px; border: 1px solid #334155;
        }

        /* Mines Style */
        .mines-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 250px; margin: 10px 0; }
        .mine-tile { height: 75px; background: #0b0f19; border-radius: 12px; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }

        canvas { border-radius: 12px; background: #0b0f19; }
    </style>
</head>
<body>

    <div id="win-modal">
        <h2 id="modal-title" style="margin:0; color: var(--gold);">🎉 Выигрыш!</h2>
        <p id="modal-text" style="font-size: 18px; margin: 8px 0 0 0;">+1000 VIR</p>
    </div>

    <div class="header">
        <span id="user-name">👤 Игрок</span>
        <div class="balance">💰 <span id="user-balance">500</span> VIR</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('plinko', this)">🟢 Plinko</button>
        <button class="tab-btn" onclick="switchTab('slots', this)">🎰 Слоты</button>
        <button class="tab-btn" onclick="switchTab('wheel', this)">🎡 Колесо</button>
        <button class="tab-btn" onclick="switchTab('mines', this)">💣 Мины</button>
        <button class="tab-btn" onclick="switchTab('coin', this)">🪙 Монета</button>
        <button class="tab-btn" onclick="switchTab('profile', this)" style="background: #334155;">👤 Профиль</button>
    </div>

    <!-- 1. PLINKO -->
    <div id="plinko-game" class="game-card tab-content">
        <div id="plinko-board"></div>
        <div class="controls">
            <input type="number" id="plinko-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" onclick="dropBall()">Спустить шар</button>
        </div>
    </div>

    <!-- 2. SLOTS -->
    <div id="slots-game" class="game-card tab-content" style="display:none;">
        <div class="slots-box">
            <div class="slot-reel" id="s1">🎰</div>
            <div class="slot-reel" id="s2">🎰</div>
            <div class="slot-reel" id="s3">🎰</div>
        </div>
        <div class="controls">
            <input type="number" id="slots-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" id="slots-btn" onclick="spinSlots()">Крутить слоты</button>
        </div>
    </div>

    <!-- 3. WHEEL -->
    <div id="wheel-game" class="game-card tab-content" style="display:none;">
        <canvas id="wheel-canvas" width="280" height="280"></canvas>
        <div class="controls">
            <input type="number" id="wheel-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" onclick="spinWheel()">Крутить колесо</button>
        </div>
    </div>

    <!-- 4. MINES -->
    <div id="mines-game" class="game-card tab-content" style="display:none;">
        <div class="mines-grid" id="mines-board"></div>
        <div class="controls">
            <input type="number" id="mines-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" onclick="startMines()">Начать игру</button>
        </div>
    </div>

    <!-- 5. COIN -->
    <div id="coin-game" class="game-card tab-content" style="display:none;">
        <div style="font-size: 90px; margin: 15px;" id="coin-icon">🪙</div>
        <div class="controls">
            <input type="number" id="coin-bet" class="bet-input" value="50" min="10">
            <div style="display:flex; gap: 8px;">
                <button class="action-btn" onclick="flipCoin('орёл')">Орёл</button>
                <button class="action-btn" style="background:#0284c7;" onclick="flipCoin('решка')">Решка</button>
            </div>
        </div>
    </div>

    <!-- 6. PROFILE -->
    <div id="profile-page" class="game-card tab-content" style="display:none; text-align: center;">
        <h2 style="margin: 10px 0;">Мой Профиль</h2>
        <p id="prof-id">ID: -</p>
        <p id="prof-balance" style="font-size: 20px; font-weight: bold; color: var(--gold);">Баланс: 500 VIR</p>
        <button class="action-btn" id="bonus-btn" onclick="claimBonus()" style="margin-top: 15px;">🎁 Ежедневный бонус (+1000 VIR)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseInt(localStorage.getItem('vir_balance')) || 500;
        let lastBonus = localStorage.getItem('vir_last_bonus');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = '👤 ' + tg.initDataUnsafe.user.first_name;
            document.getElementById('prof-id').innerText = 'ID: ' + tg.initDataUnsafe.user.id;
        }

        function updateBalance(amt) {
            balance += amt;
            localStorage.setItem('vir_balance', balance);
            document.getElementById('user-balance').innerText = balance;
            document.getElementById('prof-balance').innerText = 'Баланс: ' + balance + ' VIR';
        }
        updateBalance(0);

        function showNotice(title, text, isWin) {
            const modal = document.getElementById('win-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-title').style.color = isWin ? 'var(--gold)' : 'var(--red)';
            document.getElementById('modal-text').innerText = text;
            modal.style.display = 'block';
            setTimeout(() => { modal.style.display = 'none'; }, 1800);
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + (tab === 'profile' ? '-page' : '-game')).style.display = 'flex';
            btn.classList.add('active');
            if(tab === 'wheel') drawWheel();
            if(tab === 'mines' && document.getElementById('mines-board').children.length === 0) setupMinesGrid();
        }

        /* --- 1. REALISTIC PLINKO --- */
        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
        const engine = Engine.create();
        const render = Render.create({
            element: document.getElementById('plinko-board'),
            engine: engine,
            options: { width: 280, height: 320, wireframes: false, background: '#0b0f19' }
        });

        // Пины пирамидой
        for (let i = 0; i < 7; i++) {
            let count = i + 3;
            let spacing = 280 / (count + 1);
            for (let j = 0; j < count; j++) {
                Composite.add(engine.world, Bodies.circle((j + 1) * spacing, 35 + i * 36, 4, {
                    isStatic: true,
                    render: { fillStyle: '#38bdf8' }
                }));
            }
        }

        // Реалистичные корзины с коэффициентами
        const mults = [10, 2, 0.5, 0.2, 0.5, 2, 10];
        const colors = ['#ef4444', '#f97316', '#eab308', '#64748b', '#eab308', '#f97316', '#ef4444'];
        const bWidth = 280 / mults.length;

        for (let i = 0; i < mults.length; i++) {
            let sensor = Bodies.rectangle(i * bWidth + bWidth / 2, 305, bWidth - 2, 25, {
                isStatic: true,
                isSensor: true,
                render: { fillStyle: colors[i] },
                label: `m_${mults[i]}`
            });
            Composite.add(engine.world, sensor);
        }
        Render.run(render); Runner.run(Runner.create(), engine);

        function dropBall() {
            let bet = parseInt(document.getElementById('plinko-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return showNotice('Ошибка', 'Недостаточно баланса!', false);
            updateBalance(-bet);
            
            let ball = Bodies.circle(140 + (Math.random() * 8 - 4), 10, 6, {
                restitution: 0.6,
                friction: 0.1,
                render: { fillStyle: '#facc15' },
                label: `b_${bet}`
            });
            Composite.add(engine.world, ball);
        }

        Events.on(engine, 'collisionStart', (e) => {
            e.pairs.forEach((p) => {
                let b = p.bodyA.label.startsWith('b_') ? p.bodyA : (p.bodyB.label.startsWith('b_') ? p.bodyB : null);
                let m = p.bodyA.label.startsWith('m_') ? p.bodyA : (p.bodyB.label.startsWith('m_') ? p.bodyB : null);
                if(b && m) {
                    let bet = parseFloat(b.label.split('_')[1]);
                    let mult = parseFloat(m.label.split('_')[1]);
                    let win = Math.floor(bet * mult);
                    updateBalance(win);
                    showNotice(mult >= 1 ? '🎉 Выигрыш!' : '📉 Проигрыш', `x${mult} (${win} VIR)`, mult >= 1);
                    Composite.remove(engine.world, b);
                }
            });
        });

        /* --- 2. SLOTS ENGINE --- */
        const slotItems = ['7️⃣', '🍒', '🍋', '💎', '🔔'];
        function spinSlots() {
            let bet = parseInt(document.getElementById('slots-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return showNotice('Ошибка', 'Недостаточно баланса!', false);
            updateBalance(-bet);

            let btn = document.getElementById('slots-btn');
            btn.disabled = true;

            let interval = setInterval(() => {
                document.getElementById('s1').innerText = slotItems[Math.floor(Math.random()*slotItems.length)];
                document.getElementById('s2').innerText = slotItems[Math.floor(Math.random()*slotItems.length)];
                document.getElementById('s3').innerText = slotItems[Math.floor(Math.random()*slotItems.length)];
            }, 100);

            setTimeout(() => {
                clearInterval(interval);
                btn.disabled = false;
                
                let r1 = slotItems[Math.floor(Math.random()*slotItems.length)];
                let r2 = slotItems[Math.floor(Math.random()*slotItems.length)];
                let r3 = slotItems[Math.floor(Math.random()*slotItems.length)];
                
                document.getElementById('s1').innerText = r1;
                document.getElementById('s2').innerText = r2;
                document.getElementById('s3').innerText = r3;

                if(r1 === r2 && r2 === r3) {
                    let win = bet * 10;
                    updateBalance(win);
                    showNotice('🔥 ДЖЕКПОТ!', `+${win} VIR (x10)`, true);
                } else if(r1 === r2 || r2 === r3 || r1 === r3) {
                    let win = bet * 2;
                    updateBalance(win);
                    showNotice('🎉 Выигрыш!', `+${win} VIR (x2)`, true);
                } else {
                    showNotice('❌ Неповезло', 'Попробуй еще раз!', false);
                }
            }, 1200);
        }

        /* --- 3. WHEEL ENGINE --- */
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const sectors = [0, 2, 0.5, 3, 0, 1.5, 0.2, 5];
        function drawWheel(angle = 0) {
            let arc = (2 * Math.PI) / sectors.length;
            ctx.clearRect(0, 0, 280, 280);
            for (let i = 0; i < sectors.length; i++) {
                let sa = angle + i * arc;
                ctx.beginPath(); ctx.fillStyle = i % 2 === 0 ? '#0284c7' : '#38bdf8';
                ctx.moveTo(140, 140); ctx.arc(140, 140, 120, sa, sa + arc); ctx.fill();
                ctx.save(); ctx.translate(140, 140); ctx.rotate(sa + arc / 2);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`x${sectors[i]}`, 60, 5); ctx.restore();
            }
        }
        function spinWheel() {
            let bet = parseInt(document.getElementById('wheel-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return showNotice('Ошибка', 'Недостаточно баланса!', false);
            updateBalance(-bet);
            let rot = Math.PI * 8 + Math.random() * Math.PI * 2, start = performance.now();
            function anim(time) {
                let prog = Math.min((time - start) / 2500, 1);
                let ease = 1 - Math.pow(1 - prog, 3);
                drawWheel(rot * ease);
                if(prog < 1) requestAnimationFrame(anim);
                else {
                    let norm = (2 * Math.PI - ((rot * ease) % (2 * Math.PI))) % (2 * Math.PI);
                    let idx = Math.floor(norm / ((2 * Math.PI) / sectors.length));
                    let win = Math.floor(bet * sectors[idx]);
                    updateBalance(win);
                    showNotice(sectors[idx] >= 1 ? '🎉 Выигрыш!' : '📉 Проигрыш', `x${sectors[idx]} (${win} VIR)`, sectors[idx] >= 1);
                }
            }
            requestAnimationFrame(anim);
        }

        /* --- 4. MINES --- */
        let minePos = -1, minesActive = false, currentMinesBet = 0;
        function setupMinesGrid() {
            let board = document.getElementById('mines-board');
            board.innerHTML = '';
            for(let i=0; i<9; i++) {
                let tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.innerText = '❓';
                tile.onclick = () => clickMine(i, tile);
                board.appendChild(tile);
            }
        }
        function startMines() {
            let bet = parseInt(document.getElementById('mines-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return showNotice('Ошибка', 'Недостаточно баланса!', false);
            updateBalance(-bet);
            currentMinesBet = bet;
            minePos = Math.floor(Math.random() * 9);
            minesActive = true;
            setupMinesGrid();
        }
        function clickMine(idx, tile) {
            if(!minesActive || tile.innerText !== '❓') return;
            if(idx === minePos) {
                tile.innerText = '💣'; tile.style.background = 'var(--red)';
                minesActive = false;
                showNotice('💥 БУМ!', 'Ты подорвался на мине', false);
            } else {
                tile.innerText = '💎'; tile.style.background = 'var(--green)';
                minesActive = false;
                let win = currentMinesBet * 2;
                updateBalance(win);
                showNotice('💎 ЧИСТО!', `+${win} VIR (x2)`, true);
            }
        }

        /* --- 5. COIN FLIP --- */
        function flipCoin(choice) {
            let bet = parseInt(document.getElementById('coin-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return showNotice('Ошибка', 'Недостаточно баланса!', false);
            updateBalance(-bet);
            let res = Math.random() > 0.5 ? 'орёл' : 'решка';
            document.getElementById('coin-icon').innerText = res === 'орёл' ? '🪙' : '👑';
            if(choice === res) {
                let win = bet * 2;
                updateBalance(win);
                showNotice('🎉 УГАДАЛ!', `+${win} VIR (x2)`, true);
            } else {
                showNotice('❌ НЕУГАДАЛ', `Выпал ${res}`, false);
            }
        }

        /* --- 6. BONUS --- */
        function claimBonus() {
            let now = new Date().getTime();
            if(lastBonus && (now - parseInt(lastBonus)) < 86400000) {
                let hrs = Math.ceil((86400000 - (now - parseInt(lastBonus))) / 3600000);
                return showNotice('⏳ Жди', `Приходи через ${hrs} ч.`, false);
            }
            lastBonus = now;
            localStorage.setItem('vir_last_bonus', now);
            updateBalance(1000);
            showNotice('🎁 УСПЕХ!', '+1000 VIR на баланс', true);
        }
    </script>
</body>
</html>
