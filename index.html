<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIR CASINO WEB APP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-color: #f8fafc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .balance { font-size: 16px; font-weight: 700; color: #facc15; }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1 1 30%;
            padding: 8px 4px;
            background: var(--card-bg);
            border: 2px solid transparent;
            color: var(--text-color);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active { border-color: var(--accent); background: #0284c7; }
        .game-card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas { border-radius: 12px; background: #090d16; max-width: 100%; }
        .controls { width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .bet-input {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a;
            color: #fff; font-size: 15px; text-align: center; box-sizing: border-box;
        }
        .action-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: var(--accent-green); color: white; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        /* Mines Grid */
        .mines-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 240px; margin: 15px 0; }
        .mine-tile { height: 70px; background: #0f172a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        /* Slots */
        .slots-container { display: flex; gap: 10px; margin: 20px 0; font-size: 50px; background: #0f172a; padding: 15px; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <span id="user-name">👤 Игрок</span>
        <div class="balance">💰 <span id="user-balance">500</span> VIR</div>
    </div>

    <!-- Навигация 5 Игр + Профиль -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('plinko', this)">🟢 Plinko</button>
        <button class="tab-btn" onclick="switchTab('wheel', this)">🎡 Колесо</button>
        <button class="tab-btn" onclick="switchTab('slots', this)">🎰 Слоты</button>
        <button class="tab-btn" onclick="switchTab('mines', this)">💣 Мины</button>
        <button class="tab-btn" onclick="switchTab('coin', this)">🪙 Монета</button>
        <button class="tab-btn" onclick="switchTab('profile', this)" style="background: #475569;">👤 Профиль</button>
    </div>

    <!-- 1. PLINKO -->
    <div id="plinko-game" class="game-card tab-content">
        <div id="plinko-board"></div>
        <div class="controls">
            <input type="number" id="plinko-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" onclick="dropBall()">Спустить шар</button>
        </div>
    </div>

    <!-- 2. WHEEL -->
    <div id="wheel-game" class="game-card tab-content" style="display:none;">
        <canvas id="wheel-canvas" width="280" height="280"></canvas>
        <div class="controls">
            <input type="number" id="wheel-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" onclick="spinWheel()">Крутить</button>
        </div>
    </div>

    <!-- 3. SLOTS -->
    <div id="slots-game" class="game-card tab-content" style="display:none;">
        <div class="slots-container">
            <span id="s1">7️⃣</span><span id="s2">7️⃣</span><span id="s3">7️⃣</span>
        </div>
        <div class="controls">
            <input type="number" id="slots-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" onclick="spinSlots()">Крутить слоты</button>
        </div>
    </div>

    <!-- 4. MINES -->
    <div id="mines-game" class="game-card tab-content" style="display:none;">
        <div class="mines-grid" id="mines-board"></div>
        <div class="controls">
            <input type="number" id="mines-bet" class="bet-input" value="50" min="10">
            <button class="action-btn" id="mines-start-btn" onclick="startMines()">Начать игру</button>
        </div>
    </div>

    <!-- 5. COIN FLIP -->
    <div id="coin-game" class="game-card tab-content" style="display:none;">
        <div style="font-size: 80px; margin: 20px;" id="coin-icon">🪙</div>
        <div class="controls">
            <input type="number" id="coin-bet" class="bet-input" value="50" min="10">
            <div style="display:flex; gap: 10px;">
                <button class="action-btn" onclick="flipCoin('орёл')">Орёл</button>
                <button class="action-btn" style="background:#0284c7;" onclick="flipCoin('решка')">Решка</button>
            </div>
        </div>
    </div>

    <!-- 6. PROFILE & BONUS -->
    <div id="profile-page" class="game-card tab-content" style="display:none; text-align: center;">
        <h2 style="margin: 5px 0;">Профиль</h2>
        <p id="prof-id">ID: -</p>
        <p id="prof-balance">Баланс: 500 VIR</p>
        <button class="action-btn" id="bonus-btn" onclick="claimBonus()" style="margin-top: 15px;">🎁 Забрать бонус (+1000 VIR)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = intStorage('vir_balance', 500);
        let lastBonus = localStorage.getItem('vir_last_bonus');

        // Данные юзера из Телеграм
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = '👤 ' + tg.initDataUnsafe.user.first_name;
            document.getElementById('prof-id').innerText = 'ID: ' + tg.initDataUnsafe.user.id;
        }

        function intStorage(key, def) {
            let val = localStorage.getItem(key);
            return val ? parseInt(val) : def;
        }

        function updateBalance(amt) {
            balance += amt;
            localStorage.setItem('vir_balance', balance);
            document.getElementById('user-balance').innerText = balance;
            document.getElementById('prof-balance').innerText = 'Баланс: ' + balance + ' VIR';
        }
        updateBalance(0);

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + (tab === 'profile' ? '-page' : '-game')).style.display = 'flex';
            btn.classList.add('active');
            if(tab === 'wheel') drawWheel();
            if(tab === 'mines' && document.getElementById('mines-board').children.length === 0) setupMinesGrid();
        }

        /* --- 1. PLINKO --- */
        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
        const engine = Engine.create();
        const render = Render.create({
            element: document.getElementById('plinko-board'),
            engine: engine,
            options: { width: 280, height: 320, wireframes: false, background: '#090d16' }
        });
        for (let i = 0; i < 6; i++) {
            let count = i + 3;
            let spacing = 280 / (count + 1);
            for (let j = 0; j < count; j++) {
                Composite.add(engine.world, Bodies.circle((j + 1) * spacing, 40 + i * 40, 4, { isStatic: true, render: { fillStyle: '#38bdf8' } }));
            }
        }
        const mults = [0.2, 0.5, 2, 0.5, 0.2];
        const bWidth = 280 / mults.length;
        for (let i = 0; i < mults.length; i++) {
            Composite.add(engine.world, Bodies.rectangle(i * bWidth + bWidth / 2, 310, bWidth - 4, 20, { isStatic: true, isSensor: true, render: { fillStyle: '#1e293b' }, label: `m_${mults[i]}` }));
        }
        Render.run(render); Runner.run(Runner.create(), engine);

        function dropBall() {
            let bet = parseInt(document.getElementById('plinko-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return alert('Недостаточно баланса!');
            updateBalance(-bet);
            let ball = Bodies.circle(140 + (Math.random()*10 - 5), 10, 7, { restitution: 0.8, render: { fillStyle: '#ef4444' }, label: `b_${bet}` });
            Composite.add(engine.world, ball);
        }
        Events.on(engine, 'collisionStart', (e) => {
            e.pairs.forEach((p) => {
                let b = p.bodyA.label.startsWith('b_') ? p.bodyA : (p.bodyB.label.startsWith('b_') ? p.bodyB : null);
                let m = p.bodyA.label.startsWith('m_') ? p.bodyA : (p.bodyB.label.startsWith('m_') ? p.bodyB : null);
                if(b && m) {
                    let win = Math.floor(parseFloat(b.label.split('_')[1]) * parseFloat(m.label.split('_')[1]));
                    updateBalance(win);
                    Composite.remove(engine.world, b);
                }
            });
        });

        /* --- 2. WHEEL --- */
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const sectors = [0, 2, 0.5, 3, 0, 1.5, 0.2, 5];
        function drawWheel(angle = 0) {
            let arc = (2 * Math.PI) / sectors.length;
            ctx.clearRect(0, 0, 280, 280);
            for (let i = 0; i < sectors.length; i++) {
                let sa = angle + i * arc;
                ctx.beginPath(); ctx.fillStyle = i % 2 === 0 ? '#0284c7' : '#38bdf8';
                ctx.moveTo(140, 140); ctx.arc(140, 140, 120, sa, sa + arc); ctx.fill();
                ctx.save(); ctx.translate(140, 140); ctx.rotate(sa + arc / 2);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`x${sectors[i]}`, 60, 5); ctx.restore();
            }
        }
        function spinWheel() {
            let bet = parseInt(document.getElementById('wheel-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return alert('Недостаточно баланса!');
            updateBalance(-bet);
            let rot = Math.PI * 8 + Math.random() * Math.PI * 2, start = performance.now();
            function anim(time) {
                let prog = Math.min((time - start) / 3000, 1);
                let ease = 1 - Math.pow(1 - prog, 3);
                drawWheel(rot * ease);
                if(prog < 1) requestAnimationFrame(anim);
                else {
                    let norm = (2 * Math.PI - ((rot * ease) % (2 * Math.PI))) % (2 * Math.PI);
                    let idx = Math.floor(norm / ((2 * Math.PI) / sectors.length));
                    updateBalance(Math.floor(bet * sectors[idx]));
                }
            }
            requestAnimationFrame(anim);
        }

        /* --- 3. SLOTS --- */
        const slotItems = ['7️⃣', '🍒', '🍋', '💎', '🔔'];
        function spinSlots() {
            let bet = parseInt(document.getElementById('slots-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return alert('Недостаточно баланса!');
            updateBalance(-bet);
            let r1 = slotItems[Math.floor(Math.random()*slotItems.length)];
            let r2 = slotItems[Math.floor(Math.random()*slotItems.length)];
            let r3 = slotItems[Math.floor(Math.random()*slotItems.length)];
            document.getElementById('s1').innerText = r1;
            document.getElementById('s2').innerText = r2;
            document.getElementById('s3').innerText = r3;
            if(r1 === r2 && r2 === r3) updateBalance(bet * 5);
            else if(r1 === r2 || r2 === r3 || r1 === r3) updateBalance(bet * 1.5);
        }

        /* --- 4. MINES --- */
        let minePos = -1, minesActive = false, currentMinesBet = 0;
        function setupMinesGrid() {
            let board = document.getElementById('mines-board');
            board.innerHTML = '';
            for(let i=0; i<9; i++) {
                let tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.innerText = '❓';
                tile.onclick = () => clickMine(i, tile);
                board.appendChild(tile);
            }
        }
        function startMines() {
            let bet = parseInt(document.getElementById('mines-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return alert('Недостаточно баланса!');
            updateBalance(-bet);
            currentMinesBet = bet;
            minePos = Math.floor(Math.random() * 9);
            minesActive = true;
            setupMinesGrid();
        }
        function clickMine(idx, tile) {
            if(!minesActive || tile.innerText !== '❓') return;
            if(idx === minePos) {
                tile.innerText = '💣'; tile.style.background = '#ef4444';
                minesActive = false; alert('Бум! Ты подорвался.');
            } else {
                tile.innerText = '💎'; tile.style.background = '#22c55e';
                minesActive = false;
                updateBalance(currentMinesBet * 2);
                alert('Чисто! Выигрыш: +' + (currentMinesBet * 2) + ' VIR');
            }
        }

        /* --- 5. COIN FLIP --- */
        function flipCoin(choice) {
            let bet = parseInt(document.getElementById('coin-bet').value);
            if(isNaN(bet) || bet <= 0 || bet > balance) return alert('Недостаточно баланса!');
            updateBalance(-bet);
            let res = Math.random() > 0.5 ? 'орёл' : 'решка';
            document.getElementById('coin-icon').innerText = res === 'орёл' ? '🪙' : '👑';
            if(choice === res) {
                updateBalance(bet * 2);
                alert('Угадал! Результат: ' + res + '. Выигрыш: +' + (bet * 2));
            } else {
                alert('Не угадал! Выпал: ' + res);
            }
        }

        /* --- 6. BONUS --- */
        function claimBonus() {
            let now = new Date().getTime();
            if(lastBonus && (now - parseInt(lastBonus)) < 86400000) {
                let hrs = Math.ceil((86400000 - (now - parseInt(lastBonus))) / 3600000);
                return alert('Заходи через ' + hrs + ' ч.');
            }
            lastBonus = now;
            localStorage.setItem('vir_last_bonus', now);
            updateBalance(1000);
            alert('Ты получил +1000 VIR!');
        }
    </script>
</body>
</html>
